<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial; background:#f5f5f5; }
        .box { width:420px; margin:120px auto; background:white; padding:35px; border-radius:10px; box-shadow:0 2px 10px #ddd; }
        input { width:100%; padding:12px; margin:10px 0; box-sizing:border-box; }
        button { width:100%; padding:12px; background:#222; color:white; border:0; cursor:pointer; }
        .error { color:red; margin-bottom:15px; }
    </style>
</head>
<body>
<div class="box">
    <h1>Login</h1>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ '/authorize' if oauth else '/login' }}">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>

        {% if oauth %}
            <input type="hidden" name="client_id" value="{{ client_id }}">
            <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
            <input type="hidden" name="response_type" value="{{ response_type }}">
            <input type="hidden" name="state" value="{{ state }}">
            <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
            <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
            <input type="hidden" name="scope" value="{{ scope }}">
        {% endif %}

        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
