services:

  auth_server:
    build: .
    command: uvicorn auth_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"


  mcp_server:
    build: .
    command: python mcp_server.py
    ports:
      - "8001:8001"
    extra_hosts:
      - "auth.localhost:host-gateway"
    depends_on:
      - auth_server
