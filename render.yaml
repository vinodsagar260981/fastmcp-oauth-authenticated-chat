services:

  # ==========================================
  # AUTH SERVER
  # ==========================================
  - type: web
    name: fastmcp-oauth-authenticated-chat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn auth_server:app --host 0.0.0.0 --port 10000

    envVars:
      - key: MCP_CLIENT_ID
        value: demo-mcp-client

      - key: MCP_CLIENT_SECRET
        sync: false

  # ==========================================
  # MCP SERVER
  # ==========================================
  - type: web
    name: fastmcp-mcp-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: python mcp_server.py

    envVars:
      - key: AUTH_SERVER_URL
        value: https://fastmcp-oauth-authenticated-chat.onrender.com

      - key: MCP_CLIENT_ID
        value: demo-mcp-client

      - key: MCP_CLIENT_SECRET
        sync: false

  # ==========================================
  # CHAT APPLICATION
  # ==========================================
  - type: web
    name: fastmcp-chat
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn chat_app:app --host 0.0.0.0 --port 10000

    envVars:
      - key: AUTH_SERVER_URL
        value: https://fastmcp-oauth-authenticated-chat.onrender.com

      - key: MCP_SERVER_URL
        value: https://fastmcp-mcp-server-n8r6.onrender.com

      - key: CHAT_PUBLIC_URL
        value: https://fastmcp-chat.onrender.com

      - key: MCP_CLIENT_ID
        value: demo-mcp-client

      - key: MCP_CLIENT_SECRET
        sync: false